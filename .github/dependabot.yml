# Every npm dependency is build tooling: the site ships no runtime JavaScript
# from npm, so one group is enough. Astro gets its own group because its
# majors change content and markdown APIs and deserve a deliberate look.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      build-toolchain:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
